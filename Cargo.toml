[package]
name = "serverkit"
version = "0.1.0"
edition = "2024"
description = "A portable Rust HTTP application layer for Workers and native servers"
readme = "README.md"

[workspace]
members = [".", "macros"]
resolver = "3"

[features]
default = []
json = ["dep:serde", "dep:serde_json"]
worker = ["dep:futures-core", "dep:worker"]
websocket = ["dep:futures-util", "dep:tokio-tungstenite"]

[dependencies]
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
serverkit-macros = { version = "0.1.0", path = "macros" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-core = { version = "0.3", optional = true }
worker = { version = "0.8.5", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures-util = { version = "0.3", features = ["sink"], optional = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["net", "rt"] }
tokio-tungstenite = { version = "0.29", optional = true }
