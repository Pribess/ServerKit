[package]
name = "serverkit"
version = "0.4.0"
edition = "2024"
description = "A portable Rust HTTP application layer for Workers and native servers"
readme = "README.md"
license.workspace = true
repository.workspace = true

[workspace]
members = [".", "macros", "adapters/hyper", "adapters/worker"]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/Pribess/ServerKit"

[features]
default = []
json = ["dep:serde", "dep:serde_json"]
websocket = []

[dependencies]
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
serverkit-macros = { version = "0.2.0", path = "macros" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
